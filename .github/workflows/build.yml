name: Build Velox

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Build Windows
        run: |
          mkdir build
          g++ src/*.cpp -Iinclude -O2 -o build/velox.exe

      - uses: actions/upload-artifact@v4
        with:
          name: velox-windows
          path: build/velox.exe

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Compiler
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Build Linux
        run: |
          mkdir -p build
          g++ src/*.cpp -Iinclude -O2 -o build/velox
          chmod +x build/velox

      - uses: actions/upload-artifact@v4
        with:
          name: velox-linux
          path: build/velox